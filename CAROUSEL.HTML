<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bootstrap Carousel</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .carousel-item img{
      height:500px;
      object-fit:cover;
    }

    .carousel-caption{
      background: rgba(0,0,0,0.5);
      border-radius:10px;
      padding:10px;
    }
  </style>
</head>
<body>

<div id="demo" class="carousel slide carousel-fade"
     data-bs-ride="carousel"
     data-bs-interval="2000">

  <!-- Indicators -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="tom and jerry.jpg" class="d-block w-100" alt="Tom and Jerry">
      <div class="carousel-caption">
        <h3>Tom & Jerry</h3>
        <p>Best Cartoon Duo</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="yj2.avif" class="d-block w-100" alt="Tom">
      <div class="carousel-caption">
        <h3>Tom</h3>
        <p>The Funny Cat</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="tj3.jfif" class="d-block w-100" alt="Jerry">
      <div class="carousel-caption">
        <h3>Jerry</h3>
        <p>The Clever Mouse</p>
      </div>
    </div>

  </div>

  <!-- Previous Button -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <!-- Next Button -->
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

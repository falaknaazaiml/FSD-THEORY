<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Fixed-width container -->
<div class="container bg-warning p-3 mt-3">
    <h3>Container</h3>
    <p>This box has margins on both sides.</p>
</div>

<!-- Full-width container -->
<div class="container-fluid bg-success text-white p-3 mt-3">
    <h3>Container Fluid</h3>
    <p>This box stretches across the entire screen.</p>
</div>

</body>
</html>

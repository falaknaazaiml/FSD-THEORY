<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap 5 Images</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

  <h2>Responsive Image</h2>
  <img src="delighted.webp" download" class="img-fluid" alt="Responsive">

  <hr>

  <h2>Rounded Image</h2>
  <img src="delighted.webp" class="rounded" alt="Rounded">

  <hr>

  <h2>Circle Image</h2>
  <img src="delighted.webp" class="rounded-circle" width="200" height="200" alt="Circle">

  <hr>

  <h2>Thumbnail Image</h2>
  <img src="delighted.webp" alt="Thumbnail">

  <hr>

  <h2>Left Aligned</h2>
  <img src="delighted.webp" class="float-start" width="150" alt="Left">

  <div class="clearfix"></div>

  <hr>

  <h2>Right Aligned</h2>
  <img src="delighted.webp" class="float-end" width="150" alt="Right">

  <div class="clearfix"></div>

  <hr>

  <h2>Centered Image</h2>
  <img src="delighted.webp" class="d-block mx-auto" width="200" alt="Center">

</div>

</body>
</html>

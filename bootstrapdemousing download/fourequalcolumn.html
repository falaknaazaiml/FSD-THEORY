<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Equal Columns</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row">
        <div class="col-3 bg-primary text-white p-3 text-center">
            Column 1
        </div>
        <div class="col-3 bg-success text-white p-3 text-center">
            Column 2
        </div>
        <div class="col-3 bg-warning text-dark p-3 text-center">
            Column 3
        </div>
        <div class="col-3 bg-danger text-white p-3 text-center">
            Column 4
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Simple Bootstrap Example</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-primary">Welcome to Bootstrap</h1>

    <p class="lead">
        Bootstrap makes web pages responsive and attractive.
    </p>

    <button class="btn btn-success" onclick="showAlert()">
        Click Me
    </button>

    <!-- Alert message (hidden initially) -->
    <div id="message" class="alert alert-warning mt-3" style="display:none;">
        This is a Bootstrap alert message.
    </div>

</div>

<script>
    function showAlert() {
        document.getElementById("message").style.display = "block";
    }
</script>

</body>
</html>

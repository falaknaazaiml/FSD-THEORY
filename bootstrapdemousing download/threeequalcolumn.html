<!DOCTYPE html>
<html>
<head>
    <title>Three Columns</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="row">

        <div class="col-4 bg-danger text-white p-3">    //p-3 padding space i.e 1rem(16px) rem-root element
            Column 1
        </div>

        <div class="col-4 bg-warning p-3">
            Column 2
        </div>

        <div class="col-4 bg-info p-3">
            Column 3
        </div>

    </div>

</div>

</body>
</html>

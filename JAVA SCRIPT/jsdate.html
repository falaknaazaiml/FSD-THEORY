<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Date Object Example</title>
</head>
<body>

    <h2>JavaScript Date Object Example</h2>
    <p>Open the browser console (F12 → Console) to view the output.</p>

    <script>
        // Current date and time
        const timeNow = new Date();
        console.log("Current Date & Time:", timeNow);

        // Date from milliseconds (Unix Epoch)
        const time1 = new Date(0);
        console.log("Date from 0 milliseconds:", time1);

        // Date from milliseconds
        const time2 = new Date(100000000000);
        console.log("Date from 100000000000 milliseconds:", time2);

        // Date from string (YYYY-MM-DD)
        const date1 = new Date("2020-07-01");
        console.log("Date from string:", date1);

        // Date from ISO format (UTC)
        const date2 = new Date("2020-07-01T12:00:00Z");
        console.log("Date from ISO string:", date2);

        // Date using year, month, day, hour, minute, second, millisecond
        // Note: Month starts from 0 (January = 0, February = 1)
        const time3 = new Date(2020, 1, 20, 4, 12, 11, 0);
        console.log("Custom Date:", time3);

        // Display output on webpage
        document.write("<h3>Output</h3>");
        document.write("<p><b>Current Date & Time:</b> " + timeNow + "</p>");
        document.write("<p><b>Date from 0 milliseconds:</b> " + time1 + "</p>");
        document.write("<p><b>Date from 100000000000 milliseconds:</b> " + time2 + "</p>");
        document.write("<p><b>Date from string:</b> " + date1 + "</p>");
        document.write("<p><b>Date from ISO string:</b> " + date2 + "</p>");
        document.write("<p><b>Custom Date:</b> " + time3 + "</p>");
    </script>

</body>
</html>

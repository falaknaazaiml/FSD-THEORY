<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Object Example</title>
</head>
<body>

    <h2>JavaScript Object Example</h2>
    <p>Open the browser console (F12 → Console) to view the output.</p>

    <script>
        // Defining an object
        let person = {
            first_name: "CBIT",
            last_name: "MGIT",

            // Method
            getFunction() {
                return "The name of the person is " +
                       this.first_name + " " +
                       this.last_name;
            },

            // Object within an object
            phone_number: {
                mobile: "12345",
                landline: "6789"
            }
        };

        // Display in console
        console.log(person.getFunction());
        console.log("Mobile Number:", person.phone_number.mobile);
        console.log("Landline Number:", person.phone_number.landline);

        // Display on webpage
        document.write("<h2>Output</h2>");
        document.write("<p><b>Name:</b> " + person.getFunction() + "</p>");
        document.write("<p><b>Mobile Number:</b> " + person.phone_number.mobile + "</p>");
        document.write("<p><b>Landline Number:</b> " + person.phone_number.landline + "</p>");
    </script>

</body>
</html>

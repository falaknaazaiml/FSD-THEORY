<!DOCTYPE html>
<html>
<head>
    <title>Email Validation</title>
</head>
<body>

<script>
    let email = "student@gmail.com";

    let pattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$/;

    if (pattern.test(email))
        document.write("Valid Email");
    else
        document.write("Invalid Email");
</script>

</body>
</html>

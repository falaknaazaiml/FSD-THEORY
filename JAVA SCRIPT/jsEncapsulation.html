<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Class Example - Person</title>
</head>
<body>

    <h2>JavaScript Class Example - Person</h2>
    <p>Open the browser console (F12 → Console) to view the output.</p>

    <script>
        // Define Person class
        class Person {

            // Constructor
            constructor(name, id) {
                this.name = name;
                this.id = id;
            }

            // Method to add address
            add_Address(address) {
                this.address = address;
            }

            // Method to display details
            getDetails() {
                return `Name: ${this.name}<br>
                        ID: ${this.id}<br>
                        Address: ${this.address}`;
            }
        }

        // Create object
        let person1 = new Person("CBIT", 45);

        // Add address
        person1.add_Address("Hyderabad");

        // Display in Console
        console.log("Name:", person1.name);
        console.log("ID:", person1.id);
        console.log("Address:", person1.address);
        console.log(person1.getDetails());

        // Display on Web Page
        document.write("<h2>Person Details</h2>");
        document.write(person1.getDetails());
    </script>

</body>
</html>

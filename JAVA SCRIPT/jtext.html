<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript String Methods</title>
</head>
<body>

    <h2>JavaScript String Methods Example</h2>
    <p>Open the browser console (F12 → Console) to view the output.</p>

    <script>
        // Declare strings
        const text1 = 'hello';
        const text2 = 'world';
        const text3 = '     JavaScript    ';

        // String Methods
        console.log("concat():", text1.concat(' ', text2));      // hello world
        console.log("toUpperCase():", text1.toUpperCase());      // HELLO
        console.log("trim():", text3.trim());                    // JavaScript
        console.log("split():", text1.split());                  // ["hello"]
        console.log("slice(1,3):", text1.slice(1, 3));           // el
        console.log("search('Script'):", text3.search("Script"));// 9
        console.log("charAt(2):", text1.charAt(2));              // l
        console.log("substr(0,3):", text1.substr(0, 3));         // hel
        console.log("substring(0,4):", text1.substring(0, 4));   // hell

        // Display output on the webpage
        document.write("<h3>Output</h3>");
        document.write("<p><b>concat():</b> " + text1.concat(' ', text2) + "</p>");
        document.write("<p><b>toUpperCase():</b> " + text1.toUpperCase() + "</p>");
        document.write("<p><b>trim():</b> " + text3.trim() + "</p>");
        document.write("<p><b>split():</b> " + JSON.stringify(text1.split()) + "</p>");
        document.write("<p><b>slice(1,3):</b> " + text1.slice(1, 3) + "</p>");
        document.write("<p><b>search('Script'):</b> " + text3.search("Script") + "</p>");
        document.write("<p><b>charAt(2):</b> " + text1.charAt(2) + "</p>");
        document.write("<p><b>substr(0,3):</b> " + text1.substr(0, 3) + "</p>");
        document.write("<p><b>substring(0,4):</b> " + text1.substring(0, 4) + "</p>");
    </script>

</body>
</html>

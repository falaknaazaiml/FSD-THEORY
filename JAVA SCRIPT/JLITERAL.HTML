<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Example</title>
</head>
<body>

<script>
let person = {
    first_name: 'CBIT',
    last_name: 'MGIT',

    getFunction() {
        return `The name of the person is ${this.first_name} ${this.last_name}`;
    },

    phone_number: {
        mobile: '12345',
        landline: '6789'
    }
};

console.log(person.getFunction());
console.log(person.phone_number.landline);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Inheritance Example</title>
</head>
<body>

    <h2>JavaScript Inheritance Example (ES6)</h2>
    <p>Open the browser console (F12 → Console) to view the output.</p>

    <script>
        // Parent Class
        class Person {

            // Constructor
            constructor(name) {
                this.name = name;
            }

            // Method
            toString() {
                return `Name of Person: ${this.name}`;
            }
        }

        // Child Class
        class Student extends Person {

            // Constructor
            constructor(name, id) {

                // Call parent class constructor
                super(name);

                this.id = id;
            }

            // Method Overriding
            toString() {
                return `${super.toString()}, Student ID: ${this.id}`;
            }
        }

        // Create Object
        let student1 = new Student("Abhilan", 22);

        // Display in Console
        console.log(student1.toString());

        // Display on Web Page
        document.write("<h2>Student Details</h2>");
        document.write("<p>" + student1.toString() + "</p>");
    </script>

</body>
</html>

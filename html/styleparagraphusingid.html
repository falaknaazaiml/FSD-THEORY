<!DOCTYPE html>
<html>
<head>
    <style>
        /* General style for all paragraphs */
        p {
            text-align: center; /* Centers text horizontally */
            color: red;         /* Makes text red */
        }

        /* Special style for the paragraph with id="para1" */
        #para1 {
            color: blue;        /* Overrides red with blue */
            font-weight: bold;  /* Makes the text bold */
        }
    </style>
</head>
<body>
    <p>Every paragraph will be affected by the general style.</p>
    <p id="para1">I have my own unique style!</p>
    <p>And me! I follow the general style.</p>
</body>
</html>
